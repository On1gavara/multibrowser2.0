# Инструкция для GitHub Actions: как собрать APK на серверах GitHub.
# Лежит по пути .github/workflows/build.yml

name: Build APK

# Когда запускать: при каждом изменении кода (push) и вручную кнопкой "Run workflow".
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # виртуальная машина с Linux (Android SDK там уже установлен)
    steps:
      # 1. Скачать код репозитория на машину.
      - uses: actions/checkout@v4

      # 2. Установить Java 17 (нужна для сборки Android).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Установить Gradle нужной версии.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # 4. Собрать отладочный APK. Флаг включает библиотеки AndroidX.
      - run: gradle assembleDebug -Pandroid.useAndroidX=true

      # 5. Выложить готовый APK, чтобы его можно было скачать.
      - uses: actions/upload-artifact@v4
        with:
          name: MultiBrowser-apk
          path: app/build/outputs/apk/debug/app-debug.apk
